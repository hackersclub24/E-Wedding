<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">\n<defs>\n
  <!-- Base Wax Drop Shadow -->
  <filter id="wax-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4a2e05" flood-opacity="0.45"/>
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
  </filter>

  <!-- 3D Convex Bevel Filter for Wax Rim -->
  <filter id="gold-bevel" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="-2" dy="-2" stdDeviation="2" flood-color="#fff5cc" flood-opacity="0.9"/>
    <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#543707" flood-opacity="0.6"/>
  </filter>

  <!-- Gold Ring Gradient -->
  <radialGradient id="gold-rim-grad" cx="35%" cy="30%" r="65%">
    <stop offset="0%" stop-color="#fff6cc"/>
    <stop offset="20%" stop-color="#f5d061"/>
    <stop offset="45%" stop-color="#d49b28"/>
    <stop offset="70%" stop-color="#966312"/>
    <stop offset="90%" stop-color="#cca03b"/>
    <stop offset="100%" stop-color="#734707"/>
  </radialGradient>

  <!-- Inner Disc Sunburst / Radial Gold -->
  <radialGradient id="gold-inner-grad" cx="42%" cy="38%" r="60%">
    <stop offset="0%" stop-color="#fcedb4"/>
    <stop offset="35%" stop-color="#e2ab3c"/>
    <stop offset="75%" stop-color="#ab7418"/>
    <stop offset="100%" stop-color="#80500a"/>
  </radialGradient>

  <!-- Embossed Monogram Gold Highlight -->
  <linearGradient id="emboss-gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fff9e0"/>
    <stop offset="50%" stop-color="#e8b446"/>
    <stop offset="100%" stop-color="#734807"/>
  </linearGradient>

  <filter id="emboss-engrave" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="-1" dy="-1" stdDeviation="0.8" flood-color="#ffffff" flood-opacity="0.85"/>
    <feDropShadow dx="1.5" dy="2" stdDeviation="1" flood-color="#472a03" flood-opacity="0.7"/>
  </filter>
