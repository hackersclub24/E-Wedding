<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-metal-arch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff8dc"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
    <linearGradient id="bell-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="50%" stop-color="#d49a26"/>
      <stop offset="100%" stop-color="#7a4e06"/>
    </linearGradient>
    <filter id="gold-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8b5a00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Scalloped Palace Arch Border -->
  <g filter="url(#gold-glow)">
    <!-- Top outer frame -->
    <path d="M 0 0 L 500 0 L 500 25 L 0 25 Z" fill="url(#gold-metal-arch)" opacity="0.85"/>
    
    <!-- Scalloped Mughal Multi-foil Arch -->
    <path d="M 0 25 
             Q 30 25 50 45 
             Q 75 25 105 45 
             Q 135 25 165 45 
             Q 205 20 250 15 
             Q 295 20 335 45 
             Q 365 25 395 45 
             Q 425 25 450 45 
             Q 470 25 500 25 
             L 500 0 L 0 0 Z" fill="url(#gold-metal-arch)"/>

    <!-- Filigree Lace Trim on Arch Edge -->
    <path d="M 0 28 
             Q 30 28 50 48 
             Q 75 28 105 48 
             Q 135 28 165 48 
             Q 205 23 250 18 
             Q 295 23 335 48 
             Q 365 28 395 48 
             Q 425 28 450 48 
             Q 470 28 500 28" fill="none" stroke="#fff9d9" stroke-width="2"/>

    <!-- Hanging Royal Temple Bells & Tassels -->
    <!-- Bell 1 (Left Outer) -->
    <g transform="translate(65, 45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="url(#gold-metal-arch)" stroke-width="2"/>
      <circle cx="0" cy="40" r="4" fill="url(#bell-gold)"/>
      <path d="M -8 44 Q 0 42 8 44 L 10 58 Q 0 62 -10 58 Z" fill="url(#bell-gold)"/>
      <circle cx="0" cy="61" r="3" fill="#663e06"/>
      <path d="M 0 63 L 0 74" stroke="#d49a26" stroke-width="2"/>
      <circle cx="0" cy="74" r="2.5" fill="#ffd700"/>
    </g>

    <!-- Bell 2 (Left Mid) -->
    <g transform="translate(135, 45)">
      <line x1="0" y1="0" x2="0" y2="55" stroke="url(#gold-metal-arch)" stroke-width="2"/>
      <circle cx="0" cy="55" r="5" fill="url(#bell-gold)"/>
      <path d="M -11 60 Q 0 57 11 60 L 13 78 Q 0 83 -13 78 Z" fill="url(#bell-gold)"/>
      <circle cx="0" cy="82" r="4" fill="#663e06"/>
      <path d="M 0 85 L 0 98" stroke="#d49a26" stroke-width="2.5"/>
      <circle cx="0" cy="98" r="3" fill="#ffd700"/>
    </g>

    <!-- Center Regal Kalash / Crest -->
    <g transform="translate(250, 18)">
      <circle cx="0" cy="0" r="8" fill="url(#bell-gold)"/>
      <path d="M -7 4 Q 0 0 7 4 L 9 14 Q 0 17 -9 14 Z" fill="url(#bell-gold)"/>
      <circle cx="0" cy="18" r="3" fill="#fffae0"/>
    </g>

    <!-- Bell 3 (Right Mid) -->
    <g transform="translate(365, 45)">
      <line x1="0" y1="0" x2="0" y2="55" stroke="url(#gold-metal-arch)" stroke-width="2"/>
      <circle cx="0" cy="55" r="5" fill="url(#bell-gold)"/>
      <path d="M -11 60 Q 0 57 11 60 L 13 78 Q 0 83 -13 78 Z" fill="url(#bell-gold)"/>
      <circle cx="0" cy="82" r="4" fill="#663e06"/>
      <path d="M 0 85 L 0 98" stroke="#d49a26" stroke-width="2.5"/>
      <circle cx="0" cy="98" r="3" fill="#ffd700"/>
    </g>

    <!-- Bell 4 (Right Outer) -->
    <g transform="translate(435, 45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="url(#gold-metal-arch)" stroke-width="2"/>
      <circle cx="0" cy="40" r="4" fill="url(#bell-gold)"/>
      <path d="M -8 44 Q 0 42 8 44 L 10 58 Q 0 62 -10 58 Z" fill="url(#bell-gold)"/>
      <circle cx="0" cy="61" r="3" fill="#663e06"/>
      <path d="M 0 63 L 0 74" stroke="#d49a26" stroke-width="2"/>
      <circle cx="0" cy="74" r="2.5" fill="#ffd700"/>
    </g>
  </g>
</svg>